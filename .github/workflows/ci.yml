name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release build and backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./Ecommerce-Coffee-Shop.sln

      - name: Build
        run: dotnet build ./Ecommerce-Coffee-Shop.sln --configuration Release --no-restore

      - name: Run backend unit tests
        run: dotnet test ./Ecommerce-Coffee-Shop.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=backend.trx" --results-directory ./artifacts/backend-tests

      - name: Upload backend test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/backend-tests/*.trx
          if-no-files-found: ignore
          retention-days: 7
