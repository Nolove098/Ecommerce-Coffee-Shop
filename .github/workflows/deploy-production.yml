name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  validate:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./SaleStore.csproj

      - name: Build
        run: dotnet build ./SaleStore.csproj --configuration Release --no-restore

      - name: Run available .NET tests
        run: dotnet test ./SaleStore.csproj --configuration Release --no-build

  deploy:
    name: Railway production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: CoffeeShop-Demo
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment target configuration
        shell: bash
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID PRODUCTION_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Required production configuration is missing: $name"
              missing=1
            fi
          done
          test "$missing" = "0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.49.1

      - name: Deploy existing Railway service
        run: >-
          railway up --ci
          --project "$RAILWAY_PROJECT_ID"
          --environment production
          --service "$RAILWAY_SERVICE_ID"

      - name: Verify production health
        shell: bash
        run: |
          health_url="${PRODUCTION_URL%/}/health"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 15 "$health_url" > /dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Verify public smoke endpoints
        shell: bash
        run: |
          origin="${PRODUCTION_URL%/}"
          check_status() {
            local path="$1"
            local expected="$2"
            local status
            for attempt in {1..12}; do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "$origin$path" || true)"
              if [ "$status" = "$expected" ]; then
                return 0
              fi
              if [ "$attempt" -lt 12 ]; then
                sleep 10
              fi
            done
            echo "::error::Smoke check failed for $path (expected HTTP $expected)"
            return 1
          }

          check_status "/" "200"
          check_status "/css/custom.css" "200"
          check_status "/Auth/CurrentUser" "401"
