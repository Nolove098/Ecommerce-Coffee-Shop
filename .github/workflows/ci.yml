name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./SaleStore.csproj

      - name: Build
        run: dotnet build ./SaleStore.csproj --configuration Release --no-restore

      - name: Run safe tests
        run: dotnet test ./SaleStore.csproj --configuration Release --no-build
