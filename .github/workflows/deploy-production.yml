name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  validate:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./SaleStore.csproj

      - name: Build
        run: dotnet build ./SaleStore.csproj --configuration Release --no-restore

      - name: Run available .NET tests
        run: dotnet test ./SaleStore.csproj --configuration Release --no-build

  deploy:
    name: Railway production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: CoffeeShop-Demo
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment target configuration
        shell: bash
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID PRODUCTION_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Required production configuration is missing: $name"
              missing=1
            fi
          done
          test "$missing" = "0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.49.1

      - name: Deploy existing Railway service
        shell: bash
        run: |
          for attempt in 1 2; do
            if railway up --ci \
              --project "$RAILWAY_PROJECT_ID" \
              --environment production \
              --service "$RAILWAY_SERVICE_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "Railway upload/deploy attempt failed; retrying once."
              sleep 10
            fi
          done
          exit 1

      - name: Verify production health
        shell: bash
        run: |
          origin="${PRODUCTION_URL%/}"
          case "$origin" in
            https://*) ;;
            http://*) origin="https://${origin#http://}" ;;
            *) echo "::error::PRODUCTION_URL must be an HTTP(S) origin"; exit 1 ;;
          esac
          health_url="$origin/health"
          for attempt in {1..12}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$health_url" || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Verify public smoke endpoints
        shell: bash
        run: |
          origin="${PRODUCTION_URL%/}"
          case "$origin" in
            https://*) ;;
            http://*) origin="https://${origin#http://}" ;;
            *) echo "::error::PRODUCTION_URL must be an HTTP(S) origin"; exit 1 ;;
          esac
          check_status() {
            local path="$1"
            local expected="$2"
            local status
            for attempt in {1..12}; do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Cache-Control: no-cache' --max-time 20 "$origin$path" || true)"
              if [ "$status" = "$expected" ]; then
                return 0
              fi
              if [ "$attempt" -lt 12 ]; then
                sleep 10
              fi
            done
            echo "::error::Smoke check failed for $path (expected HTTP $expected, received HTTP $status)"
            return 1
          }

          check_status "/" "200"
          check_status "/css/custom.css" "200"

      - name: Validate production E2E credential presence
        shell: bash
        env:
          BootstrapAdmin__Username: ${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}
          BootstrapAdmin__Password: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BootstrapStaff__Username: ${{ secrets.BOOTSTRAP_STAFF_USERNAME }}
          BootstrapStaff__Password: ${{ secrets.BOOTSTRAP_STAFF_PASSWORD }}
        run: |
          missing=0
          for name in BootstrapAdmin__Username BootstrapAdmin__Password BootstrapStaff__Username BootstrapStaff__Password; do
            if [ -z "${!name}" ]; then
              echo "::error::Required production E2E credential is missing: $name"
              missing=1
            fi
          done
          test "$missing" = "0"

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run five critical production tests
        id: critical-e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.PRODUCTION_URL }}
          BootstrapAdmin__Username: ${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}
          BootstrapAdmin__Password: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BootstrapStaff__Username: ${{ secrets.BOOTSTRAP_STAFF_USERNAME }}
          BootstrapStaff__Password: ${{ secrets.BOOTSTRAP_STAFF_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        shell: bash
        run: |
          origin="${PLAYWRIGHT_BASE_URL%/}"
          case "$origin" in
            https://*) ;;
            http://*) origin="https://${origin#http://}" ;;
            *) echo "::error::PLAYWRIGHT_BASE_URL must be an HTTP(S) origin"; exit 1 ;;
          esac
          export PLAYWRIGHT_BASE_URL="$origin"
          npx playwright test tests/critical-demo.spec.js \
            --workers=1 \
            --retries=0 \
            --trace=off \
            --reporter=line,json \
            --output="pw-results-ci-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Report failed critical test names
        if: ${{ failure() && steps.critical-e2e.outcome == 'failure' }}
        shell: bash
        run: |
          if [ ! -f playwright-results.json ]; then
            exit 0
          fi
          node - <<'NODE'
          const report = require('./playwright-results.json');
          function walk(suite, parents = []) {
            const scope = suite.title ? [...parents, suite.title] : parents;
            for (const spec of suite.specs || []) {
              const failed = (spec.tests || []).some(test =>
                (test.results || []).some(result => result.status !== 'passed' && result.status !== 'skipped'));
              if (failed) {
                console.log(`::error::Critical E2E failed: ${[...scope, spec.title].join(' > ')}`);
                if (spec.title === 'public pages and protected-route behavior') {
                  const result = (spec.tests || []).flatMap(test => test.results || [])
                    .find(item => item.status !== 'passed' && item.status !== 'skipped');
                  const message = String(result?.error?.message || 'No error message available')
                    .replace(/\x1b\[[0-9;]*m/g, '')
                    .replace(/[\r\n]+/g, ' ')
                    .slice(0, 800);
                  console.log(`::error::Public test diagnostic: ${message}`);
                }
              }
            }
            for (const child of suite.suites || []) walk(child, scope);
          }
          for (const suite of report.suites || []) walk(suite);
          NODE

      - name: Upload safe Playwright failure diagnostics
        if: ${{ failure() && steps.critical-e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pw-results-ci-${{ github.run_id }}-${{ github.run_attempt }}/**/*.png
            pw-results-ci-${{ github.run_id }}-${{ github.run_attempt }}/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
